<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ms-04 Retail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-box">
      <h2>Login Retail Service</h2>
      <p class="muted">Demo akun: <b>kasir/123</b>, <b>manajer/123</b>, <b>owner/123</b></p>
      <form id="login-form">
        <label>Username</label>
        <input id="username" required placeholder="kasir / manajer / owner">
        <label>Password</label>
        <div class="row" style="gap:8px; align-items:center;">
          <input id="password" type="password" required placeholder="123" style="flex:1;">
          <button type="button" class="secondary small" id="toggle-pass" style="width:auto;">Tampil</button>
        </div>
        <button type="submit" class="mt" style="width:100%;">Masuk</button>
        <div id="login-status" class="status"></div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    if (getUser()) window.location.href = 'index.html';
    qs('toggle-pass').onclick = () => {
      const p = qs('password');
      const show = p.type === 'password';
      p.type = show ? 'text' : 'password';
      qs('toggle-pass').textContent = show ? 'Sembunyi' : 'Tampil';
    };
    qs('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      setStatus('login-status', 'Memproses login...');
      try {
        const res = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username: qs('username').value.trim(), password: qs('password').value })
        });
        localStorage.setItem('retail_user', JSON.stringify(res.user));
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'index.html';
      } catch (err) {
        setStatus('login-status', err.message, false);
      }
    });
  </script>
</body>
</html>
